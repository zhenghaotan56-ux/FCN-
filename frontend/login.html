<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · FCN 估值工作台</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="login-page">
  <main class="login-card card">
    <p class="eyebrow">STRUCTURED PRODUCTS</p>
    <h1>FCN 估值工作台</h1>
    <p class="muted">登录后查看产品参数、估算票息和结算情景。</p>
    {% if demo %}<p class="badge">离线演示 · 合成行情</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>账号<input name="username" autocomplete="username" required {% if demo %}value="demo"{% endif %}></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required {% if demo %}value="fcn-demo-only"{% endif %}></label>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button class="primary" type="submit">登录工作台</button>
    </form>
  </main>
</body>
</html>

services:
  fcn:
    build:
      context: .
      args:
        FCN_OPENBB_EXTRA: ${FCN_OPENBB_EXTRA:-0}
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fcn-data:/srv/fcn/var
      - ./private:/srv/fcn/private:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fcn-data:
